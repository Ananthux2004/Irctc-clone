<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Ticket - IRCTC Clone</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/book-ticket.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div
        class="container"
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
        "
      >
        <!-- Left Logo -->
        <img
          src="images/right-logo.png"
          alt="Left Logo"
          style="
            height: 64px;
            width: 64px;
            object-fit: contain;
            margin-right: 10px;
          "
        />
        <div
          class="logo-section"
          style="display: flex; align-items: center; gap: 10px"
        >
          <h1 style="margin: 0; font-size: 1.7rem">IRCTC</h1>
        </div>
        <nav
          style="
            display: flex;
            align-items: center;
            gap: 24px;
            margin-left: auto;
          "
        >
          <a href="index.html" class="nav-link">Home</a>
          <div class="nav-dropdown">
            <a href="#" class="nav-link active"
              >Trains <i class="fas fa-caret-down"></i
            ></a>
            <div class="dropdown-content">
              <a href="#" class="dropdown-item">View Trains</a>
              <a href="book-ticket.html" class="dropdown-item">Book Tickets</a>
              <a href="#" class="dropdown-item">Cancel Tickets</a>
            </div>
          </div>
          <a href="#" class="nav-link">About Us</a>
          <a href="contact.html" class="nav-link">Contact Us</a>
          <a href="#" class="nav-link">Alerts</a>
          <div class="auth-section" style="display: inline-block">
            <a
              href="login.html"
              class="nav-link"
              id="loginLink"
              style="
                background: #10467b;
                color: #fff;
                border-radius: 6px;
                padding: 0.25rem 1rem;
              "
              >Login</a
            >
            <button
              class="nav-link user-logout"
              id="userInfo"
              style="display: none"
            >
              <span id="username"></span>
            </button>
          </div>
        </nav>
        <!-- Right Logo -->
        <img
          src="images/left-logo.jpg"
          alt="Right Logo"
          style="
            height: 64px;
            width: 64px;
            object-fit: contain;
            margin-left: 10px;
          "
        />
      </div>
    </header>

    <div class="main-container">
      <div class="booking-section">
        <h2>Book Your Ticket</h2>
        <div class="train-details" id="trainDetails">
          <!-- Train details will be populated here -->
        </div>

        <div class="seat-selection">
          <h3>Select Seats</h3>
          <div class="seat-options">
            <div class="seat-type">
              <label for="seatClass">Select Class:</label>
              <select id="seatClass">
                <option value="GEN">General</option>
                <option value="SL">Sleeper (SL)</option>
                <option value="AC">AC</option>
              </select>
            </div>
            <div class="seat-count">
              <label>Number of Seats:</label>
              <div class="seat-counter">
                <button type="button" id="decrementSeats" class="counter-btn">
                  -
                </button>
                <input
                  type="number"
                  id="numberOfSeats"
                  value="1"
                  min="1"
                  max="6"
                  readonly
                />
                <button type="button" id="incrementSeats" class="counter-btn">
                  +
                </button>
              </div>
            </div>
          </div>
          <div class="price-details" id="priceDetails">
            <h4>Price Details</h4>
            <div class="price-breakdown">
              <p>Base Fare: <span id="baseFare">₹0</span></p>
              <p>GST (5%): <span id="gst">₹0</span></p>
              <p>Convenience Fee: <span id="convenienceFee">₹0</span></p>
              <hr />
              <p class="total">
                Total Amount: <span id="totalAmount">₹0</span>
              </p>
            </div>
          </div>
        </div>

        <div class="payment-section">
          <h3>Payment Details</h3>
          <div class="payment-methods">
            <div class="payment-method">
              <input type="radio" id="upi" name="paymentMethod" value="upi" />
              <label for="upi"><i class="fas fa-mobile-alt"></i> UPI</label>
            </div>
            <div class="payment-method">
              <input type="radio" id="card" name="paymentMethod" value="card" />
              <label for="card"
                ><i class="fas fa-credit-card"></i> Credit/Debit Card</label
              >
            </div>
            <div class="payment-method">
              <input
                type="radio"
                id="netBanking"
                name="paymentMethod"
                value="netBanking"
              />
              <label for="netBanking"
                ><i class="fas fa-university"></i> Net Banking</label
              >
            </div>
          </div>

          <div class="payment-details" id="paymentDetails">
            <!-- Payment form will be dynamically loaded based on selection -->
          </div>
          <div class = "button-container">
          <button class="proceed-btn" id="proceedToPayment">
            Proceed to Payment
          </button>
          </div>
        </div>
      </div>
    </div>

  <div id="billingPopup" class="popup-overlay">
    <div class="popup-content">
      <span class="close-btn" onclick="closeBillingPopup()">&times;</span>
      <h2>Billing Summary</h2>
      <div id="billingDetails">
        <!-- Dynamic content will be injected here -->
      </div>
      <div class="popup-actions">
        <button onclick="closeBillingPopup()">Close</button>
        <button id="payNow">Pay</button>
      </div>
    </div>
  </div>

  <!-- Separate overlay for checkmark animation -->
  <div id="checkmarkOverlay" class="hidden">
    <div id="checkmarkContainer">
      <svg class="checkmark" viewBox="0 0 52 52">
        <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
        <path class="checkmark-check" fill="none" d="M14 27l7 7 16-16"/>
      </svg>
      <p class="paid-text">Paid</p>
    </div>
  </div>


    <script>
      document.addEventListener("DOMContentLoaded", function () {
  // Get elements
  const incrementBtn = document.getElementById("incrementSeats");
  const decrementBtn = document.getElementById("decrementSeats");
  const numberOfSeats = document.getElementById("numberOfSeats");
  const seatClass = document.getElementById("seatClass");
  const proceedBtn = document.getElementById("proceedToPayment");

  // Base fares
  const baseFares = {
    GEN: 200,
    SL: 400,
    AC: 1000,
  };

  // Prices
  let baseFare = 0;
  let gst = 0;
  let convenienceFee = 0;
  let total = 0;

  // Increment button click handler
  incrementBtn.addEventListener("click", function () {
    let count = parseInt(numberOfSeats.value);
    if (count < 6) {
      count++;
      numberOfSeats.value = count;
      updatePrices();
    }
  });

  // Decrement button click handler
  decrementBtn.addEventListener("click", function () {
    let count = parseInt(numberOfSeats.value);
    if (count > 1) {
      count--;
      numberOfSeats.value = count;
      updatePrices();
    }
  });

  // Update prices
  function updatePrices() {
    const count = parseInt(numberOfSeats.value);
    const fare = baseFares[seatClass.value];
    baseFare = fare * count;
    gst = Math.round(baseFare * 0.05);
    convenienceFee = 30 * count;
    total = baseFare + gst + convenienceFee;

    document.getElementById("baseFare").textContent = "₹" + baseFare;
    document.getElementById("gst").textContent = "₹" + gst;
    document.getElementById("convenienceFee").textContent = "₹" + convenienceFee;
    document.getElementById("totalAmount").textContent = "₹" + total;

    decrementBtn.disabled = count <= 1;
    incrementBtn.disabled = count >= 6;
  }

  // Initialize
  numberOfSeats.value = 1;
  updatePrices();

  seatClass.addEventListener("change", updatePrices);

  // Billing popup logic
  proceedBtn.addEventListener("click", function () {
    const selectedPayment = document.querySelector('input[name="paymentMethod"]:checked');
    if (!selectedPayment) {
      alert("Please select a payment method");
      return;
    }

    const bookingDetails = {
      userId: "U12345", // Replace with actual session value
      trainId: "T98765", // Replace with actual URL param
      seatClass: seatClass.value,
      seats: parseInt(numberOfSeats.value),
      baseFare: baseFare,
      gst: gst,
      convenienceFee: convenienceFee,
      totalAmount: total,
      paymentMethod: selectedPayment.value
    };

    const billingDetails = document.getElementById("billingDetails");
    billingDetails.innerHTML = `
      <p><strong>User ID:</strong> ${bookingDetails.userId}</p>
      <p><strong>Train ID:</strong> ${bookingDetails.trainId}</p>
      <p><strong>Seat Class:</strong> ${bookingDetails.seatClass}</p>
      <p><strong>Seats:</strong> ${bookingDetails.seats}</p>
      <p><strong>Base Fare:</strong> ₹${bookingDetails.baseFare}</p>
      <p><strong>GST (5%):</strong> ₹${bookingDetails.gst}</p>
      <p><strong>Convenience Fee:</strong> ₹${bookingDetails.convenienceFee}</p>
      <p><strong>Total Amount:</strong> ₹${bookingDetails.totalAmount}</p>
      <p><strong>Payment Method:</strong> ${bookingDetails.paymentMethod}</p>
    `;

    // Show billing popup
    document.getElementById("billingPopup").style.display = "flex";
    // Make sure checkmark is hidden initially
    const checkmarkOverlay = document.getElementById("checkmarkOverlay");
    checkmarkOverlay.style.display = "none";
  });

  // Close popup
  window.closeBillingPopup = function () {
    document.getElementById("billingPopup").style.display = "none";
    document.getElementById("checkmarkOverlay").style.display = "none";
  };
});

// Initialize the payment button handler
document.getElementById("payNow").addEventListener("click", function() {
  // Show the checkmark animation
  const checkmarkOverlay = document.getElementById("checkmarkOverlay");
  checkmarkOverlay.style.display = "flex";

  // Dim the billing popup content
  document.querySelector(".popup-content").classList.add("inactive");

  // Auto-close both popups after animation
  setTimeout(function() {
    document.getElementById("billingPopup").style.display = "none";
    checkmarkOverlay.style.display = "none";
    document.querySelector(".popup-content").classList.remove("inactive");
    
    // TODO: Add redirection to confirmation page or other post-payment logic here
  }, 2000);
});


    </script>
    <script src="assets/session.js"></script>
    <script src="assets/book-ticket.js"></script>
  </body>
</html>
